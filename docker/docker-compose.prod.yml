# manage-my-life — production stack (self-hosted, Caddy auto-TLS).
#
# Run from the repo root:
#   docker compose --env-file .env -f docker/docker-compose.prod.yml up -d --build
# (or `make prod-up`). Build contexts are ./backend and ./frontend.
#
# Caddy terminates TLS for ${DOMAIN} (Let's Encrypt) and routes:
#   /api/*    -> backend:8080
#   /ws/*     -> backend:8080  (WebSocket upgrade)
#   /uploads/*-> backend:8080  (avatars + attachments)
#   /*        -> frontend:3000 (Next.js)

name: manage-my-life

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-manage_my_life}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mml} -d ${POSTGRES_DB:-manage_my_life}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [mml]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [mml]

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        SQLX_OFFLINE: "true"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mml}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-manage_my_life}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ACCESS_TOKEN_TTL_SECS: ${ACCESS_TOKEN_TTL_SECS:-900}
      REFRESH_TOKEN_TTL_SECS: ${REFRESH_TOKEN_TTL_SECS:-2592000}
      HOST: 0.0.0.0
      PORT: "8080"
      SQLX_OFFLINE: "true"
      RUST_LOG: ${RUST_LOG:-manage_my_life=info,tower_http=warn}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [mml]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Baked into the Next.js bundle at build time. Same origin as the site;
        # Caddy routes /api and /ws to the backend.
        NEXT_PUBLIC_API_URL: https://${DOMAIN}
        NEXT_PUBLIC_WS_URL: wss://${DOMAIN}
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${DOMAIN}
      NEXT_PUBLIC_WS_URL: wss://${DOMAIN}
    depends_on:
      - backend
    networks: [mml]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      TLS_EMAIL: ${TLS_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      - frontend
      - backend
    networks: [mml]

networks:
  mml:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  uploads:
  caddy_data:
  caddy_config:
