# manage-my-life — production stack for a self-hosted server (Cloudflare Tunnel + host nginx).
#
# This server already terminates TLS at Cloudflare and routes by Host through a
# cloudflared tunnel -> host nginx (:80) -> app loopback ports. So this stack
# runs NO reverse proxy of its own: it binds the frontend + backend to
# 127.0.0.1:<port>, and an nginx vhost (docker/nginx/app.example.com.conf)
# routes app.example.com to them.
#
# Run from the repo root:
#   docker compose --env-file .env -f docker/docker-compose.server.yml up -d --build
# (or `make server-up`).

name: manage-my-life

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-manage_my_life}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mml} -d ${POSTGRES_DB:-manage_my_life}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [mml]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [mml]

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        SQLX_OFFLINE: "true"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mml}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-manage_my_life}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ACCESS_TOKEN_TTL_SECS: ${ACCESS_TOKEN_TTL_SECS:-900}
      REFRESH_TOKEN_TTL_SECS: ${REFRESH_TOKEN_TTL_SECS:-2592000}
      HOST: 0.0.0.0
      PORT: "8080"
      SQLX_OFFLINE: "true"
      RUST_LOG: ${RUST_LOG:-manage_my_life=info,tower_http=warn}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # loopback only — fronted by host nginx
      - "127.0.0.1:${API_PORT:-3101}:8080"
    networks: [mml]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}
        NEXT_PUBLIC_WS_URL: wss://${DOMAIN}
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${DOMAIN}
      NEXT_PUBLIC_WS_URL: wss://${DOMAIN}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    networks: [mml]

networks:
  mml:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  uploads:
