# /etc/nginx/sites-available/app.example.com  (symlink into sites-enabled)
# Cloudflare Tunnel -> nginx :80 (Host-routed) -> docker loopback ports.
# Mirrors other vhosts on the same host.
#
#   WEB_PORT (frontend Next.js) default 3100
#   API_PORT (backend Rust/Axum) default 3101
server {
    listen 80;
    server_name app.example.com;

    # avatars + work-item attachments can be a few MB
    client_max_body_size 25m;

    # REST API -> Rust backend (loopback). /api prefix preserved upstream.
    location /api/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket (realtime) -> backend, with upgrade.
    location /ws/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Uploaded files (avatars, attachments) -> backend static serving.
    location /uploads/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> Next.js web (loopback).
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
