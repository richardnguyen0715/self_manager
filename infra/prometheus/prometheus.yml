global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s
  external_labels:
    environment: docker-compose
    project: manage-my-life

# Alertmanager configuration (extend when ready)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Rule files
# rule_files:
#   - "rules/*.yml"

scrape_configs:
  # ── Prometheus self-monitoring ────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ── Rust backend (axum + prometheus-exporter or metrics endpoint) ─
  # Expects the backend to expose GET /metrics in Prometheus text format.
  # Use the `metrics` crate (axum-prometheus or prometheus crate) in Rust.
  - job_name: mml_backend
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: backend
          language: rust

  # ── Node exporter (host metrics) ─────────────────────────────────
  # Uncomment if you add node-exporter to docker-compose
  # - job_name: node_exporter
  #   static_configs:
  #     - targets: ['node-exporter:9100']

  # ── PostgreSQL exporter ───────────────────────────────────────────
  # Uncomment if you add postgres-exporter to docker-compose
  # - job_name: postgres
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # ── Redis exporter ────────────────────────────────────────────────
  # Uncomment if you add redis-exporter to docker-compose
  # - job_name: redis
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
